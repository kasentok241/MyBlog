<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>
</head>
<body>
    <h1>Blog Posts</h1>
    
    {% for post in posts %}
        <div style="border-bottom: 1px solid #ccc; margin-bottom: 20px;">
            <h2>{{ post.title }}</h2>
            <p>Published: {{ post.published_date }}</p>
            <p>{{ post.content }}</p>
        </div>
    {% endfor %}
</body>
</html>
